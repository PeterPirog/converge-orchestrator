repo_path: /absolute/path/to/project/repository
requirements_path: /absolute/path/to/project/architecture.md
github_repo: owner/repository
base_branch: main
branch_prefix: converge/

# Requirements are expected to be immutable at OS level (for example chmod 444).
require_spec_read_only: true

# OpenCode can run as CLI or attach to a long-running server.
opencode_binary: opencode
# opencode_attach_url: http://127.0.0.1:4096

# GitHub transport uses authenticated `gh api`. Credentials stay outside prompts/config.
github_binary: gh
ci_poll_seconds: 15
ci_timeout_seconds: 1800
auto_merge: false
merge_method: squash

agents:
  planner:
    agent: converge-planner
    model: null
    timeout_seconds: 1200
  builder:
    agent: converge-builder
    model: null
    timeout_seconds: 2400
  reviewer:
    agent: converge-reviewer
    model: null
    timeout_seconds: 1200

quality_gates:
  - name: tests
    command: [pytest, -q]
    required: true
  - name: lint
    command: [ruff, check, .]
    required: true

max_repair_attempts: 3
max_replans: 2
max_iterations: 50
max_diff_lines_hard: 1000

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "converge-orchestrator"
version = "0.3.0"
description = "Requirements-driven autonomous software convergence orchestrator with LangGraph and OpenCode."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PeterPirog"}]
dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "tree-sitter>=0.23.2,<0.24",
  "tree-sitter-typescript>=0.23.2,<0.24",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
converge = "converge_orchestrator.cli:app"
converge-api = "converge_orchestrator.api:main"
converge-backup = "converge_orchestrator.backup_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/converge_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

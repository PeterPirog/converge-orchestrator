# Converge project configuration
#
# Copy this file OUTSIDE the target repository, edit project/GitHub paths, then run:
#   converge models --config /absolute/path/to/converge.yaml
#   converge doctor --config /absolute/path/to/converge.yaml
#
# This template targets the current stable `opencode` CLI and OpenWebUI as the default
# OpenAI-compatible model gateway. Secrets never belong in this file.
version: 1

project:
  # Human-readable label only. It does not change the GitHub repository name.
  name: CHANGE_ME_PROJECT_NAME

  # Local clone that Converge is allowed to evolve. This must be the repository root.
  repo_path: /absolute/path/to/target-project/repository

  # Immutable architecture/requirements Markdown. Keep it OUTSIDE repo_path.
  requirements_path: /absolute/path/to/target-project/architecture.md

  # null => defaults to <repo-parent>/.converge
  state_dir: null

  # null => defaults to <state_dir>/worktrees
  worktree_dir: null

  # Recommended and enforced by `converge doctor`.
  # Example on Linux/macOS: chmod 444 /path/to/architecture.md
  require_spec_read_only: true

github:
  # Set null to disable GitHub PR/CI integration for local-only development.
  repo: owner/repository
  cli: gh
  base_branch: main
  branch_prefix: converge/
  auto_merge: false
  merge_method: squash
  ci_poll_seconds: 15
  ci_timeout_seconds: 1800

  # Disabled by default. Automatic reruns are allowed only for exact GitHub Actions check names
  # explicitly listed here. Commit-status failures, mixed flaky/non-flaky required failures and
  # ambiguous duplicate checks are never retried. The retry ledger is durable for each candidate SHA.
  flaky_ci:
    checks: []
    max_retries_per_check: 0
  # Example opt-in after a job has been independently classified as flaky:
  # flaky_ci:
  #   checks: ["test (3.13)"]
  #   max_retries_per_check: 1

opencode:
  # Current stable OpenCode CLI. In container sandbox mode this binary must exist INSIDE the image.
  binary: opencode

  # null => invoke a fresh `opencode run` for every agent call.
  # A persistent attach server is supported only in host sandbox mode; container mode rejects it
  # because the remote server would execute tools outside Converge's container boundary.
  attach_url: null

  # Converts OpenCode permission prompts into automatic approval, but explicit deny rules remain deny.
  auto_approve: true

  # null => defaults to <state_dir>/opencode.generated.json
  # This file is GENERATED from this YAML. Do not edit it by hand.
  generated_config_path: null

  # Neutral MCP layout maintained in the same user-facing file.
  # Converge converts `servers` into stable OpenCode's `mcp.<server-name>` representation.
  # Secrets should use OpenCode's {env:VARIABLE_NAME} substitution.
  mcp:
    servers: {}
    # Example remote MCP:
    # servers:
    #   docs:
    #     type: remote
    #     url: https://mcp.example.com/mcp
    #     enabled: true
    #     oauth: false
    #     headers:
    #       X-API-Key: "{env:DOCS_MCP_API_KEY}"
    #     timeout: 30000
    # Example local MCP:
    # servers:
    #   local-tools:
    #     type: local
    #     command: [python, -m, my_mcp_server]
    #     enabled: true
    #     environment:
    #       API_KEY: "{env:LOCAL_MCP_API_KEY}"

sandbox:
  # Backward-compatible default. For autonomous/untrusted execution, switch to `container` after
  # preparing a project runtime image and an internal agent network as described below.
  mode: host
  engine: docker

  # Required when mode=container. The image is never pulled implicitly by Converge and should be
  # pinned/managed by your deployment. It must contain OpenCode AND the target project's build/test
  # toolchain (for example Python/Node/Go/Rust, package managers, linters and test runners).
  image: null

  # Hardened container mode requires a named Docker network with Internal=true for agent calls.
  # Example setup: docker network create --internal converge-ai
  # OpenWebUI/model gateway and any required remote MCP proxy must be reachable on this network.
  agent_network: none

  # Deterministic quality gates/verifiers default to no network in a hardened profile. Change this
  # only when the project's tests genuinely require a deliberately provisioned network.
  quality_network: none

  # Host Converge uses models.gateway.base_url below. A sandboxed OpenCode process cannot use the
  # host loopback address, so set this to the gateway address resolvable from agent_network.
  # Hardened example: http://open-webui:8080/api
  agent_gateway_base_url: null

  require_internal_agent_network: true
  read_only_root: true
  pids_limit: 512
  memory: 8g
  cpus: 4.0
  tmpfs_size: 2g

  # Extra environment variable NAMES to forward. Values stay in the host environment. Gateway/MCP
  # {env:...} references are detected automatically; do not copy secret values into this file.
  pass_env: []

  # `host` maps the current uid/gid on POSIX. Use `image` only when the image deliberately owns the
  # writable worktree paths with an appropriate non-root user.
  user: host

  # Minimal hardened override example:
  # mode: container
  # image: ghcr.io/acme/payments-converge-runtime@sha256:...
  # agent_network: converge-ai
  # quality_network: none
  # agent_gateway_base_url: http://open-webui:8080/api

models:
  # Recommended setup when OpenWebUI is your model gateway.
  # This is the HOST-visible endpoint used by `converge models` / `converge doctor`.
  # In container sandbox mode use sandbox.agent_gateway_base_url for the agent-visible endpoint.
  # Stable OpenCode's OpenAI-compatible provider appends /chat/completions to this base URL,
  # therefore OpenWebUI uses /api here.
  gateway:
    kind: openwebui
    provider_id: openwebui
    name: OpenWebUI
    base_url: http://127.0.0.1:3000/api
    api_key_env: OPENWEBUI_API_KEY

  # One-switch routing. `local` is the reference default while local capacity is available.
  # Change only this value to `cloud` to restore the original quality-first cloud routing.
  # Both sets are validated when the YAML is loaded, but only the selected set is materialized
  # into the immutable per-run configuration snapshot and generated OpenCode provider catalog.
  mode: local

  profile_sets:
    # Original cloud routing retained verbatim for one-line rollback with `mode: cloud`.
    cloud:
      scout:
        model: deepseek-v4-flash:cloud
        name: DeepSeek V4 Flash - repository scout
        context_tokens: 1048576
        variant: null
        request_body: {}

      planner:
        model: deepseek-v4-pro:cloud
        name: DeepSeek V4 Pro - architecture reasoning
        context_tokens: 1048576
        variant: null
        request_body: {}

      builder:
        model: kimi-k2.7-code:cloud
        name: Kimi K2.7 Code - implementation builder
        context_tokens: 262144
        variant: null
        request_body: {}

      builder_fallback:
        model: qwen3-coder-next:cloud
        name: Qwen 3 Coder Next - implementation fallback
        context_tokens: 262144
        variant: null
        request_body: {}

      reviewer:
        model: glm-5.3-flash:cloud
        name: GLM 5.3 Flash - correctness reviewer
        context_tokens: 1048576
        variant: null
        request_body: {}

      security:
        model: gpt-oss:120b
        name: gpt-oss 120B - security reviewer
        context_tokens: 131072
        variant: null
        request_body: {}

    # Self-hosted routing selected from the reference OpenWebUI/Ollama catalog.
    # Keep different model families across Builder and review lanes so local-only operation does
    # not collapse independent semantic review into self-review by the implementation model.
    local:
      scout:
        # 30B total / ~3B active MoE: fast agentic repository mapping with 1M catalog context.
        model: nemotron-3.5-lightning:latest
        name: Nemotron 3.5 Lightning - local repository scout
        context_tokens: 1048576
        variant: null
        request_body: {}

      planner:
        # Strong long-horizon coding/repository reasoning; local catalog exposes 262k context.
        model: laguna-s-2.1:latest
        name: Laguna S 2.1 - local architecture reasoning
        context_tokens: 262144
        variant: null
        request_body: {}

      builder:
        # Current local Qwen tool/reasoning model; sole writer in the active worktree.
        model: qwen3.8:latest
        name: Qwen 3.8 - local implementation builder
        context_tokens: 262144
        variant: null
        request_body: {}

      builder_fallback:
        # Different family from the primary Builder for bounded execution failover.
        model: nemotron-3.5-lightning:latest
        name: Nemotron 3.5 Lightning - local implementation fallback
        context_tokens: 1048576
        variant: null
        request_body: {}

      reviewer:
        # Independent agentic/coding family from the primary Builder.
        model: muse-glimmer:latest
        name: Muse Glimmer - local correctness reviewer
        context_tokens: 131072
        variant: null
        request_body: {}

      security:
        # Large independent local reasoning family retained for security/trust-boundary review.
        model: gpt-oss:120b
        name: gpt-oss 120B - local security reviewer
        context_tokens: 131072
        variant: null
        request_body: {}

  # Do not collapse all review lanes onto the Builder model merely to reduce latency. Review model
  # diversity is part of the quality policy, not just a performance preference.

agents:
  scout:
    # Read-only, low-latency map of the exact base commit used for the next planning decision.
    agent: converge-scout
    model_profile: scout
    timeout_seconds: 900
    steps: 12
    # Ordered, explicit failover only. Every fallback is a fresh session with the same role policy.
    fallback_model_profiles: [planner]
    provider_retries: 0
    tool_permissions: {}

  planner:
    # Runtime agent ID. Safety prompt and permissions are generated by Converge itself.
    agent: converge-planner
    model_profile: planner
    timeout_seconds: 1800
    steps: 18
    fallback_model_profiles: [reviewer]
    provider_retries: 0
    tool_permissions: {}

  builder:
    agent: converge-builder
    model_profile: builder
    timeout_seconds: 3600
    steps: 60
    fallback_model_profiles: [builder_fallback]
    provider_retries: 0
    # Builder has edit + local shell access, while git push/gh/external paths stay denied.
    tool_permissions: {}

  correctness_reviewer:
    agent: converge-correctness-reviewer
    model_profile: reviewer
    timeout_seconds: 1800
    steps: 24
    fallback_model_profiles: [planner]
    provider_retries: 0
    tool_permissions: {}

  architecture_reviewer:
    agent: converge-architecture-reviewer
    model_profile: planner
    timeout_seconds: 1800
    steps: 24
    fallback_model_profiles: [reviewer]
    provider_retries: 0
    tool_permissions: {}

  security_reviewer:
    agent: converge-security-reviewer
    model_profile: security
    timeout_seconds: 1800
    steps: 24
    fallback_model_profiles: [planner]
    provider_retries: 0
    tool_permissions: {}

quality:
  # Detect safe deterministic commands from Python/Node/Go/Rust project metadata.
  auto_discover: true

  # Add explicit gates when the repository has a canonical command that discovery cannot infer.
  # Explicit commands are authoritative and duplicate discovered commands are suppressed.
  gates: []
  # Example:
  # gates:
  #   - name: project-test-suite
  #     command: [make, test]
  #     required: true
  #     timeout_seconds: 1800

  # Optional machine-verifiable evidence mapped to immutable requirement IDs.
  # Do not invent IDs: use IDs emitted into <state_dir>/contract.json after bootstrap.
  requirement_verifiers: {}
  # Example:
  # requirement_verifiers:
  #   ARCH-017:
  #     - name: architecture-boundary
  #       command: [pytest, -q, tests/architecture/test_payment_boundary.py]
  #       required: true
  #       timeout_seconds: 600

workflow:
  # Bounded autonomy. A model never receives unlimited repair/replan freedom.
  max_repair_attempts: 3
  max_replans: 2
  max_iterations: 50
  max_diff_lines_hard: 1000

  # Context safety. Authoritative requirements/task/diff are never truncated. The input budget is
  # the smaller of this fraction of model context and (context - output reserve). Only explicitly
  # advisory Scout/working-memory material may be compacted. Core overflow fails closed.
  # Hard enforcement requires agents to use model profiles with context_tokens defined.
  context_input_fraction: 0.70
  context_output_reserve_tokens: 4096

  # Explicit independent review fan-out. Every lane is read-only. One reject blocks integration.
  # Older configs may omit review_roles and keep using a single `reviewer` agent.
  review_roles:
    - correctness_reviewer
    - architecture_reviewer
    - security_reviewer
  max_parallel_reviews: 3

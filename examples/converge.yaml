repo_path: /absolute/path/to/project/repository
requirements_path: /absolute/path/to/project/architecture.md
github_repo: owner/repository
base_branch: main
branch_prefix: converge/

# Requirements are expected to be immutable at OS level (for example chmod 444).
require_spec_read_only: true

# OpenCode can run as CLI or attach to a long-running server.
opencode_binary: opencode
# opencode_attach_url: http://127.0.0.1:4096

# GitHub transport uses authenticated `gh api`. Credentials stay outside prompts/config.
github_binary: gh
ci_poll_seconds: 15
ci_timeout_seconds: 1800
auto_merge: false
merge_method: squash

agents:
  planner:
    agent: converge-planner
    model: null
    timeout_seconds: 1200
  builder:
    agent: converge-builder
    model: null
    timeout_seconds: 2400
  reviewer:
    agent: converge-reviewer
    model: null
    timeout_seconds: 1200

# Conservative stack discovery recognizes Python/Node/Go/Rust manifests and only selects
# commands supported by repository metadata. Set false for fully explicit policy.
auto_discover_quality: true

# Explicit categories override auto-discovered gates of the same kind.
quality_gates:
  - name: tests
    command: [pytest, -q]
    required: true
  - name: lint
    command: [ruff, check, .]
    required: true

# Optional deterministic evidence bound to concrete requirement IDs.
# Existing baseline failures are tolerated while a task is being repaired, but a previously
# passing mandatory verifier may never regress. If the active task targets a configured verifier,
# at least one targeted verifier must improve from non-PASS to PASS before integration.
requirement_verifiers:
  ARCH-017:
    - name: architecture-boundary
      command: [pytest, -q, tests/architecture/test_payment_boundary.py]
      required: true
      timeout_seconds: 600

max_repair_attempts: 3
max_replans: 2
max_iterations: 50
max_diff_lines_hard: 1000

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q src tests
      - run: pytest --cov=converge_orchestrator --cov-report=term-missing
      - run: pip check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: converge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d converge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONVERGE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/converge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,postgres]'
      - run: ruff check .
      - run: python -m compileall -q src tests
      - run: pytest -q tests/test_postgres_persistence.py
      - run: pip check
